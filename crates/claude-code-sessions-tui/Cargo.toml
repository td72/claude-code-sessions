[package]
name = "claude-code-sessions-tui"
version = "0.1.0"
description = "A small terminal viewer for the Claude Code sessions on this machine"
readme = "../../README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "claude-code-sessions"
path = "src/main.rs"
# The core library's documentation already lives at `claude_code_sessions`.
doc = false

[dependencies]
claude-code-sessions.workspace = true
ratatui = "0.30"

[target.'cfg(unix)'.dependencies]
claude-code-sessions-live.workspace = true

[lints]
workspace = true
