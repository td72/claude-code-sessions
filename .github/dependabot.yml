version: 2

updates:
  # A bump of a `uses:` line leaves .github/workflows/actions.lock stale and
  # verify-lockfile fails on the pull request: check the branch out, run
  # `gh actions-lock`, and push the lockfile to it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "⬆️"
    labels: [dependencies]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-minor:
        update-types: [minor, patch]
    commit-message:
      prefix: "⬆️"
    labels: [dependencies]
