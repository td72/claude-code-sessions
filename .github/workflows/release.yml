# Publishes one crate when its release pull request is merged.
#
# A release pull request comes from a branch named
#   release/<crate>-<version>      e.g. release/iktinos-live-0.1.0
# and sets that crate's `version` in its Cargo.toml. Merging it publishes the
# crate to crates.io (Trusted Publishing, no stored token) and then creates
# the tag and GitHub release `<crate>-v<version>`.
#
# Publish order when several crates change: core, then live, then tui, then
# serve, then the command (iktinos) — one release pull request each.

name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      BRANCH: ${{ github.event.pull_request.head.ref }}
      COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      # The actions below are named by tag and pinned in actions.lock. Check
      # the pins before any of them runs with the right to publish: a tag
      # that was moved since the lockfile was written stops the release here.
      - name: Verify the locked actions
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1

      - name: Read the crate and version from the branch name
        id: target
        run: |
          name="${BRANCH#release/}"
          # The longest crate name that prefixes the branch name wins, so
          # `iktinos-live-0.1.0` is not read as the core crate.
          crate="$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg name "$name" '
                [.packages[].name | select(. as $c | $name | startswith($c + "-"))]
                | sort_by(length) | last // empty')"
          if [ -z "$crate" ]; then
            echo "::error::no workspace crate matches the branch $BRANCH"
            exit 1
          fi
          version="${name#"$crate"-}"
          version="${version#v}"
          manifest="$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')"
          if [ "$version" != "$manifest" ]; then
            echo "::error::the branch says $crate $version but its Cargo.toml says $manifest"
            exit 1
          fi
          echo "crate=$crate" >> "$GITHUB_OUTPUT"
          echo "tag=$crate-v$version" >> "$GITHUB_OUTPUT"

      - name: Authenticate with crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1.0.6

      - name: Publish to crates.io
        run: cargo publish -p "$CRATE"
        env:
          CRATE: ${{ steps.target.outputs.crate }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

      # After the publish: a tag never names a version that is not on crates.io.
      - name: Create the tag and the GitHub release
        run: gh release create "$TAG" --target "$COMMIT" --generate-notes
        env:
          TAG: ${{ steps.target.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
