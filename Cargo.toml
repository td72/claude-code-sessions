[workspace]
resolver = "2"
members = ["crates/*"]

# Every crate inherits these; a version is bumped per crate (core, live and tui
# move at different speeds), everything else is shared.
[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["td72"]
repository = "https://github.com/td72/claude-code-sessions"
keywords = ["claude-code", "claude", "agents", "sessions", "transcript"]
categories = ["development-tools", "parser-implementations"]

[workspace.dependencies]
claude-code-sessions = { path = "crates/claude-code-sessions", version = "0.1.0" }
claude-code-sessions-live = { path = "crates/claude-code-sessions-live", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.clippy]
all = "warn"
